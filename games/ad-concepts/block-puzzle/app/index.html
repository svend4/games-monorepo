<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Block Surge — прод-порт (TS + Phaser 3)</title>
  <style>
    /* ==================== БАЗА И РАСКЛАДКА ==================== */
    /* Колонка: топбар меты → канвас партии (Phaser FIT) → бустер-бар.
       Мета-экран и тосты — fixed-оверлеи поверх (стили «в духе прототипа»). */
    html, body { margin: 0; padding: 0; background: #0e1117; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      color: #e8edf4; font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    #app { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }

    /* ==================== ТОПБАР МЕТЫ ==================== */
    #metaTopbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 8px 12px; max-width: 430px; width: 100%;
      margin: 0 auto; box-sizing: border-box;
    }
    .coinBox {
      display: flex; align-items: center; gap: 6px;
      background: #141b26; border: 1px solid #24324a; border-radius: 999px;
      padding: 5px 12px;
    }
    .coinBox .coinIcon { font-size: 16px; }
    .coinBox .value { font-size: 18px; font-weight: 700; color: #ffd43b; font-variant-numeric: tabular-nums; }
    .metaBtn {
      font-size: 13px; padding: 8px 14px; border-radius: 10px;
      background: #17233a; border: 1px solid #2c436b;
    }
    .metaBtn:hover { background: #1f2f4d; }

    /* ==================== БУСТЕР-БАР В ПАРТИИ ==================== */
    #boosterBar {
      display: flex; gap: 8px; padding: 6px 12px 10px; max-width: 430px;
      width: 100%; margin: 0 auto; box-sizing: border-box;
    }
    .boosterBtn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 6px 4px 5px; border-radius: 10px;
      background: #141a24; border: 1px solid #24324a;
    }
    .boosterBtn:hover { background: #1b2534; }
    .boosterBtn:active { transform: translateY(1px); }
    .boosterBtn .bEmoji { font-size: 20px; }
    .boosterBtn .bName { font-size: 12px; font-weight: 600; color: #cdd7e3; }
    .boosterBtn .bCount { font-size: 12px; font-weight: 700; color: #69db7c; font-variant-numeric: tabular-nums; }
    .boosterBtn .bPrice { font-size: 10px; color: #ffd43b; min-height: 12px; }
    .boosterBtn.zero { opacity: 0.72; }
    .boosterBtn.zero .bCount { color: #7a8798; }
    .boosterBtn.armed { border-color: #67e8f9; background: #102530; box-shadow: 0 0 0 1px #2c8ea3 inset; }

    /* ==================== ТОСТ ==================== */
    #toast {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 60; background: #1c2634; border: 1px solid #2c436b;
      border-radius: 10px; padding: 8px 16px; font-size: 13px;
      transition: opacity .25s ease; pointer-events: none; white-space: nowrap;
    }

    /* ==================== МЕТА-ЭКРАН ==================== */
    #metaScreen {
      position: fixed; inset: 0; z-index: 40;
      background: radial-gradient(120% 100% at 50% 0%, #16202e 0%, #0b0f16 70%);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .metaInner { max-width: 430px; margin: 0 auto; padding: 12px 12px 40px; display: flex; flex-direction: column; gap: 12px; }
    .metaHeader { display: flex; justify-content: space-between; align-items: center; }
    .metaClose { font-size: 13px; padding: 8px 14px; border-radius: 10px; background: #17233a; border: 1px solid #2c436b; }
    .metaClose:hover { background: #1f2f4d; }
    .metaTotals { display: flex; gap: 14px; font-size: 15px; }
    .metaTotals b { color: #ffd43b; }
    .metaSection { background: #101823; border: 1px solid #1e2a3b; border-radius: 14px; padding: 12px 12px 14px; }
    .metaSection h3 { font-size: 16px; margin: 0 0 2px; }
    .metaNote { font-size: 11.5px; color: #7d8b9f; line-height: 1.4; margin: 0 0 10px; }

    /* Карта */
    .mapList { display: flex; flex-direction: column; gap: 8px; }
    .mapNode { border: 1px solid #24324a; border-radius: 10px; padding: 9px 11px; background: #0e1622; }
    .mapNode .mnHead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .mapNode .mnReq { font-size: 12px; color: #ffd43b; font-weight: 700; }
    .mapNode .mnRew { font-size: 12px; color: #b8c4d3; margin-top: 2px; }
    .mapNode.locked { opacity: 0.6; }
    .mapNode.ready { border-color: #2f7a5a; box-shadow: 0 0 0 1px #235c44 inset; }
    .mapNode.claimed { opacity: 0.8; border-color: #2a3a52; }
    .mapNode.boss { border-color: #8a5a1a; background: #171015; }
    .mapNode.boss.ready { border-color: #b8862a; }
    .mnClaim { margin-top: 8px; font-size: 13px; padding: 6px 16px; border-radius: 8px; background: #1f4d3a; border: 1px solid #2f7a5a; }
    .mnClaim:hover { background: #256047; }
    .mnDone { margin-top: 6px; font-size: 12px; color: #69db7c; }
    .mnLock { margin-top: 6px; font-size: 12px; color: #7d8b9f; }

    /* Магазин */
    .shopList { display: flex; flex-direction: column; gap: 8px; }
    .shopItem { display: flex; align-items: center; gap: 10px; border: 1px solid #24324a; border-radius: 10px; padding: 8px 11px; background: #0e1622; }
    .shopItem .siEmoji { font-size: 22px; }
    .shopItem .siInfo { display: flex; flex-direction: column; flex: 1; }
    .shopItem .siInfo b { font-size: 13px; }
    .shopItem .siInfo span { font-size: 11px; color: #7d8b9f; }
    .shopItem .siOwned { font-size: 11px; color: #8b98a9; white-space: nowrap; }
    .siBuy { font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 8px; background: #2a2416; border: 1px solid #8a5a1a; color: #ffd43b; }
    .siBuy:hover { background: #362f1c; }

    /* Миссии */
    .missionList { display: flex; flex-direction: column; gap: 9px; }
    .mission { border: 1px solid #24324a; border-radius: 10px; padding: 9px 11px; background: #0e1622; }
    .mission.done { border-color: #2f7a5a; opacity: 0.9; }
    .mission .msTop { display: flex; justify-content: space-between; font-size: 13px; }
    .mission .msTop b { color: #ffd43b; }
    .mission .msBar { height: 8px; border-radius: 999px; background: #182130; overflow: hidden; margin: 6px 0 4px; }
    .mission .msFill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #22d3ee, #69db7c); transition: width .3s ease; }
    .mission .msProg { font-size: 11px; color: #8b98a9; }
    .mission.done .msProg { color: #69db7c; }
    .missionBonus { font-size: 12px; color: #b8c4d3; border: 1px dashed #24324a; border-radius: 10px; padding: 8px 11px; text-align: center; }
    .missionBonus.done { color: #69db7c; border-color: #2f7a5a; }

    /* Стрик */
    .streakRow { display: flex; gap: 5px; margin-bottom: 10px; }
    .streakDay { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid #24324a; border-radius: 8px; padding: 6px 2px; background: #0e1622; }
    .streakDay .sdNum { font-size: 11px; color: #8b98a9; font-weight: 700; }
    .streakDay .sdRew { font-size: 10px; color: #b8c4d3; white-space: nowrap; }
    .streakDay.reached { border-color: #2f7a5a; background: #10231c; }
    .streakDay.current { border-color: #67e8f9; box-shadow: 0 0 0 1px #2c8ea3 inset; }
    .streakBtns { display: flex; gap: 8px; }
    #streakClaimBtn { flex: 1; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 10px; background: #1f4d3a; border: 1px solid #2f7a5a; }
    #streakClaimBtn:hover:not(:disabled) { background: #256047; }
    #streakClaimBtn:disabled { opacity: 0.55; cursor: default; }
    .ghostBtn { font-size: 12px; padding: 9px 12px; border-radius: 10px; background: transparent; border: 1px solid #24324a; color: #8b98a9; }
    .ghostBtn:hover { background: #141a24; }
  </style>
</head>
<body>
  <!-- Топбар меты: монеты + вход на мета-экран (наполняет MetaUi). -->
  <div id="metaTopbar"></div>

  <!-- Канвас партии (Phaser, Scale.FIT). -->
  <div id="app"></div>

  <!-- Бустер-бар партии: Отмена / Обмен / Молот (наполняет MetaUi). -->
  <div id="boosterBar"></div>

  <!-- Оверлеи меты. -->
  <div id="toast" class="hidden"></div>
  <div id="metaScreen" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
