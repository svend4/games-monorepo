<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Orchard Peaks — прототип ядра (Проход А)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="hud-title">🍎 Orchard Peaks</div>
    <div class="hud-item" title="Баланс монет (сохраняется)">💰 <b id="hud-coins">0</b></div>
    <div class="hud-item" title="Очки за уровень">Очки: <b id="hud-score">0</b></div>
    <div class="hud-item" title="Серия подряд убранных карт">Серия: <b id="hud-chain">—</b></div>
    <div class="hud-item" title="Собранный урожай">🍎 <b id="hud-harvest">0/8</b></div>
    <button id="btn-restart" type="button">Новый расклад</button>
  </header>

  <div id="progress" title="Прогресс очистки стола"><div id="progress-fill"></div></div>

  <main id="table-area">
    <div id="peaks"></div>
  </main>

  <section id="bottom">
    <div class="pile">
      <div id="stock-card" class="card down stock-pile" role="button" tabindex="0"
           aria-label="Колода добора: открыть следующую карту">
        <span id="stock-count">0</span>
      </div>
      <div class="pile-label">Колода</div>
    </div>
    <div class="pile">
      <div id="waste-card" class="card up" aria-label="Открытая карта сброса"></div>
      <div class="pile-label">Сброс</div>
    </div>
    <p id="hint-text">
      Убирайте открытые карты на&nbsp;1 выше или ниже карты сброса.<br>
      Туз и&nbsp;Король — соседи. Карты с&nbsp;🍎 приносят монеты.
    </p>
  </section>

  <div id="overlay" class="hidden" aria-live="polite">
    <div class="panel"></div>
  </div>

  <noscript><p style="text-align:center;font-size:20px">Для игры нужен включённый JavaScript.</p></noscript>
  <script src="game.js"></script>
</body>
</html>
