<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orchard Peaks — прод-порт (TS + Vite, Проходы Е.1–Е.3)</title>
</head>
<body>
  <!-- Каркас 1:1 с prototype/index.html (Проходы А+Б+В+Г): DOM-рендер стола
       сохранён сознательно — крупные карты, aria-метки, клавиатура (доступность
       ЦА 45+, глава 07). Экраны 💎/📊/🚀 и оверлей рекламы монтируются лениво
       из src/ui/* (как в прототипе). Логика — в модулях src/, стили —
       src/style.css (порт 1:1). ВСЯ реклама и покупки — СИМУЛЯЦИЯ. -->
  <!-- Русские строки каркаса — фолбэк: applyStaticI18n() (src/i18n/dom.ts)
       подменяет их на текущую локаль (RU/EN) до инициализации UI-классов. -->
  <header id="hud">
    <div class="hud-title">🍎 Orchard Peaks</div>
    <div class="hud-item" id="hud-item-coins" title="Баланс монет (сохраняется)">💰 <b id="hud-coins">0</b></div>
    <div class="hud-item" id="hud-item-harvest-bank" title="Урожай для заказов сада (сохраняется)">🍎 <b id="hud-harvest-bank">0</b></div>
    <div class="hud-item" id="hud-item-level" title="Текущий уровень n (растит взнос E(n) и множитель W(n))"><span id="hud-level-label">Ур.</span> <b id="hud-level">1</b></div>
    <div class="hud-item" id="hud-item-score" title="Очки за уровень"><span id="hud-score-label">Очки:</span> <b id="hud-score">0</b></div>
    <div class="hud-item" id="hud-item-chain" title="Серия подряд убранных карт"><span id="hud-chain-label">Серия:</span> <b id="hud-chain">—</b></div>
    <div class="hud-item" id="hud-item-harvest" title="Урожай, собранный в этой раздаче"><span id="hud-harvest-label">🍎 стол:</span> <b id="hud-harvest">0/8</b></div>
    <button id="btn-garden" type="button" class="hud-btn">🌳 Сад</button>
    <button id="btn-store" type="button" class="hud-btn hud-btn-store">💎 Магазин</button>
    <button id="btn-dash" type="button" class="hud-btn hud-btn-dash">📊 KPI</button>
    <button id="btn-soft" type="button" class="hud-btn hud-btn-soft" title="Soft-launch кокпит: симулятор экономики, A/B, тюнинг, гейты go/no-go (Проход Е.3)">🚀 Soft</button>
    <button id="btn-restart" type="button" class="hud-btn">Новый расклад</button>
  </header>

  <div id="progress" title="Прогресс очистки стола"><div id="progress-fill"></div></div>

  <main id="table-area">
    <div id="peaks"></div>
  </main>

  <section id="booster-bar" aria-label="Бустеры">
    <button id="bst-undo" type="button" title="Отменить последний ход">↩ Отмена</button>
    <button id="bst-joker" type="button" title="Джокер: убрать любую открытую карту">🃏 Джокер (0)</button>
    <button id="bst-basket" type="button" title="Золотое лукошко: ×2 урожай за раздачу">🧺 Лукошко (0)</button>
    <button id="bst-wallet" type="button" class="bst-ad" title="Кошелёк садовода (rewarded): пополнить монеты за просмотр рекламы — СИМУЛЯЦИЯ" style="display:none">💰 Кошелёк</button>
  </section>

  <section id="bottom">
    <div class="pile">
      <div id="stock-card" class="card down stock-pile" role="button" tabindex="0"
           aria-label="Колода добора: открыть следующую карту">
        <span id="stock-count">0</span>
      </div>
      <div class="pile-label" id="stock-label">Колода</div>
    </div>
    <div class="pile">
      <div id="waste-card" class="card up" aria-label="Открытая карта сброса"></div>
      <div class="pile-label" id="waste-label">Сброс</div>
    </div>
    <p id="hint-text">
      Убирайте открытые карты на&nbsp;1 выше или ниже карты сброса.<br>
      Туз и&nbsp;Король — соседи. Карты с&nbsp;🍎 дают урожай для сада.
    </p>
  </section>

  <div id="game-toast" aria-live="polite"></div>

  <div id="overlay" class="hidden" aria-live="polite">
    <div class="panel"></div>
  </div>

  <!-- ===================== МЕТА-ЭКРАН (Проход Б) ===================== -->
  <div id="meta-screen" class="hidden" aria-label="Сад и задания">
    <header id="meta-top">
      <button id="meta-back" type="button">← Играть</button>
      <div class="meta-bal" id="meta-bal-coins" title="Монеты">💰 <b id="meta-coins">0</b></div>
      <div class="meta-bal" id="meta-bal-harvest" title="Урожай для заказов">🍎 <b id="meta-harvest">0</b></div>
    </header>
    <nav id="meta-tabs">
      <button data-tab="garden" class="active" type="button">🌳 Сад</button>
      <button data-tab="tasks" type="button">🎯 Задания</button>
      <button data-tab="shop" type="button">🛒 Лавка</button>
      <button data-tab="settings" type="button">⚙️ Настройки</button>
    </nav>
    <main id="meta-body"></main>
    <div id="meta-toast" aria-live="polite"></div>
  </div>

  <noscript><p style="text-align:center;font-size:20px">Для игры нужен включённый JavaScript.</p></noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
