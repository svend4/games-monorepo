<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEXUS 2.5D — Изометрия</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a14; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; }
#zone { position:fixed; top:12px; left:50%; transform:translateX(-50%);
  color:#c8a0ff; font-size:12px; letter-spacing:2px;
  background:rgba(0,0,0,0.65); padding:4px 18px; border-radius:8px;
  border:1px solid #4a3a7a; pointer-events:none; }
#controls { position:fixed; top:12px; right:12px; color:#556; font-size:10px;
  background:rgba(0,0,0,0.55); padding:8px 12px; border-radius:6px; line-height:1.8; }
#hud { position:fixed; bottom:0; left:0; right:0; height:58px;
  background:rgba(0,0,0,0.78); border-top:1px solid #2a2a5a;
  display:flex; align-items:center; gap:24px; padding:0 20px; }
#hp-wrap { flex:0 0 180px; }
.bar-lbl { font-size:10px; color:#e74c3c; margin-bottom:3px; }
.bar-bg  { background:#222; border-radius:3px; height:9px; }
#hp-fill { height:9px; background:#e74c3c; border-radius:3px; width:100%; transition:width .2s; }
#xp-fill { height:9px; background:#3498db; border-radius:3px; width:0%; transition:width .3s; }
#stat-area { color:#aaa; font-size:11px; line-height:1.7; }
#msg { position:fixed; top:50px; left:50%; transform:translateX(-50%);
  color:#ffd700; font-size:12px; letter-spacing:1px;
  text-shadow:0 0 8px #ffd700; opacity:0; transition:opacity .3s; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="zone">⚔ NEXUS 2.5D — ИЗОМЕТРИЯ</div>
<div id="controls">WASD · движение<br>Клик · атака врага<br>Q/E · зум<br>Колёсико · зум</div>
<div id="hud">
  <div id="hp-wrap">
    <div class="bar-lbl">HP <span id="hp-val">100/100</span></div>
    <div class="bar-bg"><div id="hp-fill"></div></div>
    <div class="bar-lbl" style="margin-top:5px;color:#3498db;">XP <span id="xp-val">0/100</span></div>
    <div class="bar-bg"><div id="xp-fill"></div></div>
  </div>
  <div id="stat-area">
    Уровень: <span id="lvl-val">1</span> &nbsp;|&nbsp;
    Золото: <span id="gold-val">0</span> &nbsp;|&nbsp;
    Атака: <span id="atk-val">20</span>
  </div>
</div>
<div id="msg"></div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight - 58; }
resize();
window.addEventListener('resize', resize);

// ISO config
const TW = 64, TH = 32, WALL_H = 28, MAP = 26;

// Tile definitions
const TD = {
  0: { top:'#3a7a3a', sl:'#2a6030', sr:'#1e5028', solid:false },           // grass
  1: { top:'#8a6a4a', sl:'#7a5a3a', sr:'#6a4a2a', solid:false },           // dirt
  2: { top:'#6a6a7a', sl:'#5a5a6a', sr:'#4a4a5a', solid:false },           // stone
  3: { top:'#1a5a9a', sl:'#0a4a8a', sr:'#083a6a', solid:true  },           // water
  4: { top:'#5a5a7a', sl:'#3a3a5a', sr:'#2a2a4a', solid:true,  elev:true },// wall
  5: { top:'#3a7a3a', sl:'#2a6030', sr:'#1e5028', solid:true,  tree:true },// tree
  7: { top:'#606070', sl:'#505060', sr:'#404050', solid:false },            // path
};

// Map generation
const map = [];
function genMap() {
  for (let y = 0; y < MAP; y++) {
    map[y] = [];
    for (let x = 0; x < MAP; x++) {
      let t;
      if (x===0||y===0||x===MAP-1||y===MAP-1) t = 4;
      else if ((x>=4&&x<=6)&&(y>=4&&y<=10)) t = 3;
      else if ((x>=18&&x<=20)&&(y>=8&&y<=13)) t = 3;
      else if ((x===3&&y===3)||(x===8&&y===16)||(x===16&&y===5)||(x===21&&y===19)||(x===5&&y===19)) t = 5;
      else if ((x===13||x===14)&&y>=2&&y<=23) t = 7;
      else if (x>=2&&x<=23&&(y===13||y===14)) t = 7;
      else if (Math.sin(x*0.9)*Math.cos(y*0.9) > 0.35) t = 1;
      else t = 0;
      map[y][x] = t;
    }
  }
}
genMap();

function solid(tx,ty) { return tx<0||ty<0||tx>=MAP||ty>=MAP||TD[map[ty][tx]].solid; }

// Camera
let camX=0, camY=0, zoom=1;

function toScreen(tx,ty) {
  return {
    sx: ((tx-ty)*TW/2)*zoom - camX + canvas.width/2,
    sy: ((tx+ty)*TH/2)*zoom - camY + canvas.height/2 - 60,
  };
}
function toTile(sx,sy) {
  const rx=(sx-canvas.width/2+camX)/zoom, ry=(sy-canvas.height/2+camY+60)/zoom;
  return { tx:Math.floor((rx/(TW/2)+ry/(TH/2))/2), ty:Math.floor((ry/(TH/2)-rx/(TW/2))/2) };
}

// Draw one tile
function drawTile(sx,sy,type,glow) {
  const d=TD[type], hw=TW/2*zoom, hh=TH/2*zoom, el=(d.elev?WALL_H:0)*zoom;
  const topCol = type===3
    ? 'hsl(210,72%,'+(33+Math.sin(performance.now()/700)*6)+'%)'
    : glow ? '#ffe066' : d.top;

  ctx.beginPath();
  ctx.moveTo(sx,sy-hh-el); ctx.lineTo(sx+hw,sy-el);
  ctx.lineTo(sx,sy+hh-el); ctx.lineTo(sx-hw,sy-el);
  ctx.closePath();
  ctx.fillStyle = topCol; ctx.fill();
  ctx.strokeStyle = glow ? '#ffe066' : 'rgba(0,0,0,0.22)';
  ctx.lineWidth = glow ? 1.5 : 0.5; ctx.stroke();

  if (el>0) {
    ctx.beginPath();
    ctx.moveTo(sx-hw,sy-el); ctx.lineTo(sx,sy+hh-el);
    ctx.lineTo(sx,sy+hh);    ctx.lineTo(sx-hw,sy);
    ctx.closePath(); ctx.fillStyle=d.sl; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sx,sy+hh-el); ctx.lineTo(sx+hw,sy-el);
    ctx.lineTo(sx+hw,sy);    ctx.lineTo(sx,sy+hh);
    ctx.closePath(); ctx.fillStyle=d.sr; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.stroke();
  }

  if (d.tree) {
    const z=zoom;
    ctx.fillStyle='#5a3a1a'; ctx.fillRect(sx-3*z, sy-25*z, 6*z, 20*z);
    const layers = [[18,-34,'#1a5a1a'],[14,-44,'#2a7a2a'],[9,-52,'#3a9a3a']];
    for (const [r,yr,col] of layers) {
      ctx.fillStyle=col; ctx.beginPath();
      ctx.ellipse(sx, sy+yr*z, r*z, r*0.55*z, 0, 0, Math.PI*2); ctx.fill();
    }
  }
}

function shade(hex, a) {
  return 'rgb('+
    Math.max(0,Math.min(255,parseInt(hex.slice(1,3),16)+a))+','+
    Math.max(0,Math.min(255,parseInt(hex.slice(3,5),16)+a))+','+
    Math.max(0,Math.min(255,parseInt(hex.slice(5,7),16)+a))+')';
}

// Draw iso box character
function drawChar(sx,sy,col,label,hp,maxHp,flash) {
  const z=zoom, bh=26*z, bw=9*z, io=TH/4*z;
  const body = flash ? '#ffffff' : col;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath();
  ctx.ellipse(sx,sy+io,14*z,5*z,0,0,Math.PI*2); ctx.fill();
  // Left face
  ctx.beginPath(); ctx.moveTo(sx-bw,sy); ctx.lineTo(sx,sy+io);
  ctx.lineTo(sx,sy+io-bh); ctx.lineTo(sx-bw,sy-bh); ctx.closePath();
  ctx.fillStyle=shade(body,-45); ctx.fill();
  // Right face
  ctx.beginPath(); ctx.moveTo(sx,sy+io); ctx.lineTo(sx+bw,sy);
  ctx.lineTo(sx+bw,sy-bh); ctx.lineTo(sx,sy+io-bh); ctx.closePath();
  ctx.fillStyle=shade(body,-65); ctx.fill();
  // Top face
  ctx.beginPath(); ctx.moveTo(sx-bw,sy-bh); ctx.lineTo(sx,sy+io-bh);
  ctx.lineTo(sx+bw,sy-bh); ctx.lineTo(sx,sy-io-bh); ctx.closePath();
  ctx.fillStyle=body; ctx.fill();
  // Head
  ctx.fillStyle='#ffddb8'; ctx.beginPath();
  ctx.arc(sx,sy-bh-10*z,9*z,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.5; ctx.stroke();
  // Name
  ctx.font='bold '+(10*z)+'px Courier New';
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText(label, sx, sy-bh-22*z); ctx.shadowBlur=0;
  // HP bar
  if (hp < maxHp) {
    const bw2=36*z, pct=hp/maxHp;
    ctx.fillStyle='#222'; ctx.fillRect(sx-bw2/2,sy-bh-34*z,bw2,4*z);
    ctx.fillStyle=pct>.5?'#2ecc71':pct>.25?'#f39c12':'#e74c3c';
    ctx.fillRect(sx-bw2/2,sy-bh-34*z,bw2*pct,4*z);
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// Game state
const player = {
  tx:13, ty:13, col:'#c8a0ff',
  hp:100, maxHp:100, atk:20, level:1, xp:0, xpNext:100, gold:0,
  moveCd:0, flash:0,
};
const enemies = [
  {tx:8, ty:8, name:'Гоблин', col:'#2ecc71',hp:60, maxHp:60, atk:8, xp:30,gold:8, dead:false,aiCd:0,  flash:0},
  {tx:17,ty:6, name:'Орк',    col:'#e74c3c',hp:120,maxHp:120,atk:16,xp:60,gold:20,dead:false,aiCd:0.5,flash:0},
  {tx:5, ty:17,name:'Тролль', col:'#f39c12',hp:180,maxHp:180,atk:22,xp:90,gold:35,dead:false,aiCd:0.8,flash:0},
  {tx:21,ty:20,name:'Призрак',col:'#8fd3ff',hp:90, maxHp:90, atk:14,xp:50,gold:15,dead:false,aiCd:0.3,flash:0},
  {tx:10,ty:20,name:'Скелет', col:'#cccccc',hp:75, maxHp:75, atk:11,xp:40,gold:10,dead:false,aiCd:0.7,flash:0},
];
const particles=[], floats=[];

function addParticles(sx,sy,col,n) {
  n = n||8;
  for(let i=0;i<n;i++) particles.push({x:sx,y:sy,vx:(Math.random()-.5)*90,vy:-Math.random()*80-20,col,r:2+Math.random()*3,life:0.75});
}
function addFloat(sx,sy,text,col) { floats.push({x:sx,y:sy-20,text,col,life:1.4,vy:-30}); }
function showMsg(t) {
  const m=document.getElementById('msg'); m.textContent=t; m.style.opacity='1';
  clearTimeout(m._t); m._t=setTimeout(function(){m.style.opacity='0';},2200);
}
function updateHUD() {
  const hp=Math.max(0,player.hp);
  document.getElementById('hp-fill').style.width=(hp/player.maxHp*100)+'%';
  document.getElementById('hp-val').textContent=hp+'/'+player.maxHp;
  document.getElementById('xp-fill').style.width=(player.xp/player.xpNext*100)+'%';
  document.getElementById('xp-val').textContent=player.xp+'/'+player.xpNext;
  document.getElementById('lvl-val').textContent=player.level;
  document.getElementById('gold-val').textContent=player.gold;
  document.getElementById('atk-val').textContent=player.atk;
}

// Input
const keys={};
window.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyQ') zoom=Math.max(0.4,zoom-.15);
  if(e.code==='KeyE') zoom=Math.min(2,zoom+.15);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('wheel',function(e){zoom=Math.max(0.4,Math.min(2,zoom-e.deltaY*.001));});

var hoverTile={tx:-1,ty:-1};
canvas.addEventListener('mousemove',function(e){
  var r=canvas.getBoundingClientRect(); hoverTile=toTile(e.clientX-r.left,e.clientY-r.top);
});
canvas.addEventListener('click',function(e){
  var r=canvas.getBoundingClientRect();
  var tt=toTile(e.clientX-r.left,e.clientY-r.top);
  for(var i=0;i<enemies.length;i++){
    var en=enemies[i]; if(en.dead) continue;
    if(Math.abs(en.tx-player.tx)<=3&&Math.abs(en.ty-player.ty)<=3&&Math.abs(en.tx-tt.tx)<=1&&Math.abs(en.ty-tt.ty)<=1){
      var dmg=player.atk+Math.floor(Math.random()*12);
      en.hp=Math.max(0,en.hp-dmg); en.flash=0.15;
      var sp=toScreen(en.tx,en.ty);
      addParticles(sp.sx,sp.sy-20,'#ff4444'); addFloat(sp.sx,sp.sy,'-'+dmg,'#ff6666');
      if(en.hp<=0){
        en.dead=true; addParticles(sp.sx,sp.sy-20,'#ffd700',15);
        addFloat(sp.sx,sp.sy-20,'+ '+en.xp+' XP','#ffd700');
        player.xp+=en.xp; player.gold+=en.gold;
        while(player.xp>=player.xpNext){
          player.xp-=player.xpNext; player.level++;
          player.xpNext=Math.floor(player.xpNext*1.4);
          player.maxHp+=20; player.hp=player.maxHp; player.atk+=5;
          showMsg('Уровень '+player.level+'!  HP+20  ATK+5');
        }
        updateHUD();
      }
      return;
    }
  }
});

// Main loop
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05); last=now;

  // Player movement
  player.moveCd=Math.max(0,player.moveCd-dt);
  if(player.flash>0) player.flash-=dt;
  if(player.moveCd<=0){
    var dx=0,dy=0;
    if(keys['KeyW']||keys['ArrowUp']) dy=-1;
    else if(keys['KeyS']||keys['ArrowDown']) dy=1;
    else if(keys['KeyA']||keys['ArrowLeft']) dx=-1;
    else if(keys['KeyD']||keys['ArrowRight']) dx=1;
    if(dx||dy){
      if(!solid(player.tx+dx,player.ty+dy)){player.tx+=dx;player.ty+=dy;}
      player.moveCd=0.14;
    }
  }

  // Camera
  var pp=toScreen(player.tx,player.ty);
  camX+=(pp.sx-canvas.width/2)*8*dt;
  camY+=(pp.sy-canvas.height/2)*8*dt;

  // Enemy AI
  for(var i=0;i<enemies.length;i++){
    var en=enemies[i]; if(en.dead) continue;
    if(en.flash>0) en.flash-=dt;
    en.aiCd=Math.max(0,en.aiCd-dt); if(en.aiCd>0) continue;
    en.aiCd=1.2+Math.random()*.8;
    var dist=Math.hypot(en.tx-player.tx,en.ty-player.ty);
    if(dist<=1.5){
      var dmg=en.atk+Math.floor(Math.random()*6);
      player.hp=Math.max(0,player.hp-dmg); player.flash=0.12;
      var sp2=toScreen(player.tx,player.ty);
      addFloat(sp2.sx,sp2.sy,'-'+dmg,'#ff4444'); updateHUD();
    } else if(dist<=7){
      var mdx=Math.sign(player.tx-en.tx),mdy=Math.sign(player.ty-en.ty);
      if(mdx&&!solid(en.tx+mdx,en.ty)) en.tx+=mdx;
      else if(mdy&&!solid(en.tx,en.ty+mdy)) en.ty+=mdy;
    }
  }

  // Particles / floats
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(var i=floats.length-1;i>=0;i--){
    var f=floats[i]; f.y+=f.vy*dt; f.life-=dt;
    if(f.life<=0) floats.splice(i,1);
  }

  // Render
  ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Build Y-sorted draw list
  var list=[];
  for(var ty=0;ty<MAP;ty++) for(var tx=0;tx<MAP;tx++){
    var sp=toScreen(tx,ty);
    if(sp.sx<-TW*2||sp.sx>canvas.width+TW*2||sp.sy<-TH*5||sp.sy>canvas.height+TH*4) continue;
    var hover=hoverTile.tx===tx&&hoverTile.ty===ty&&!TD[map[ty][tx]].solid;
    list.push({d:tx+ty,type:'tile',sx:sp.sx,sy:sp.sy,tt:map[ty][tx],hover:hover});
  }
  for(var i=0;i<enemies.length;i++){
    var en=enemies[i]; if(en.dead) continue;
    var sp=toScreen(en.tx,en.ty);
    list.push({d:en.tx+en.ty+0.5,type:'enemy',sx:sp.sx,sy:sp.sy,en:en});
  }
  var psp=toScreen(player.tx,player.ty);
  list.push({d:player.tx+player.ty+0.6,type:'player',sx:psp.sx,sy:psp.sy});
  list.sort(function(a,b){return a.d-b.d;});

  for(var i=0;i<list.length;i++){
    var it=list[i];
    if(it.type==='tile') drawTile(it.sx,it.sy,it.tt,it.hover);
    else if(it.type==='enemy') drawChar(it.sx,it.sy-TH/2*zoom,it.en.col,it.en.name+' ['+Math.floor(it.en.hp)+']',it.en.hp,it.en.maxHp,it.en.flash>0);
    else drawChar(it.sx,it.sy-TH/2*zoom,player.col,'Герой ['+player.level+']',player.hp,player.maxHp,player.flash>0);
  }

  for(var i=0;i<particles.length;i++){
    var p=particles[i]; ctx.globalAlpha=Math.max(0,p.life/.75);
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(var i=0;i<floats.length;i++){
    var f=floats[i]; ctx.globalAlpha=Math.min(1,f.life);
    ctx.font='bold 12px Courier New'; ctx.fillStyle=f.col; ctx.textAlign='center';
    ctx.shadowColor=f.col; ctx.shadowBlur=6; ctx.fillText(f.text,f.x,f.y); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1; ctx.textAlign='left';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
updateHUD();
</script>
</body>
</html>
